# Fichier de deploiement PRODUCTION, autonome - distinct de docker-compose.yml qui
# reste dedie au developpement local. Les deux ne se fusionnent pas : voir DEPLOY-VPS.txt.
#
# Differences avec le fichier de dev :
#   - gunicorn (via entrypoint.sh) au lieu de `manage.py runserver`
#   - le code n'est plus bind-monte (`.:/app`) : l'image est la source de verite
#   - le port du backend n'est publie que sur 127.0.0.1 (seul Nginx y accede)
#   - la base n'est plus publiee du tout (5432 reste interne au reseau compose)
#   - staticfiles/ et media/ sont bind-montes pour que Nginx les serve directement
#   - les logs sont plafonnes (3 x 10 Mo) : gunicorn journalise chaque requete

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # `sh entrypoint.sh` plutot que `./entrypoint.sh` : le bit d'execution est perdu
    # quand le depot est clone depuis Windows.
    command: ["sh", "/app/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8000/admin/login/', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
